<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: 'Lilita One';
        src: url('../site/assets/fonts/lilita-one.woff2') format('woff2');
        font-weight: 400;
      }
      @font-face {
        font-family: 'Nunito';
        src: url('../site/assets/fonts/nunito.woff2') format('woff2');
        font-weight: 400 900;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
      body {
        background: #1c0f06;
        color: #fff6df;
        font-family: 'Nunito', system-ui, sans-serif;
        position: relative;
      }
      .art {
        position: absolute;
        inset: 0 0 0 44%;
        background: url('../site/assets/hero-2600.webp') 66% 42% / cover no-repeat;
      }
      .art::before {
        content: '';
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, #1c0f06 0%, rgba(28, 15, 6, 0.92) 12%, rgba(28, 15, 6, 0.15) 45%, transparent 65%),
          linear-gradient(0deg, rgba(28, 15, 6, 0.75) 0%, transparent 40%);
      }
      .papel { position: absolute; inset: 0 0 auto; height: 26px; }
      .frame {
        position: absolute;
        inset: 10px;
        border: 3px solid rgba(255, 199, 44, 0.55);
        border-radius: 12px;
      }
      .copy {
        position: absolute;
        inset: 0 auto 0 64px;
        width: 660px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 18px;
      }
      .eyebrow {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        color: #ffc72c;
        font-size: 15px;
        font-weight: 900;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
      h1 {
        margin: 0;
        font-family: 'Lilita One', 'Arial Black', sans-serif;
        font-weight: 400;
        font-size: 108px;
        line-height: 0.84;
        letter-spacing: 0.005em;
        text-shadow: 0 8px 0 #2a1508;
      }
      h1 span { display: block; }
      .gold { color: #ffc72c; }
      .green { color: #78bd51; }
      .lede {
        margin: 4px 0 0;
        max-width: 520px;
        color: rgba(255, 246, 223, 0.92);
        font-size: 22px;
        line-height: 1.45;
        font-weight: 600;
      }
      .meta {
        display: flex;
        gap: 10px;
        margin-top: 4px;
      }
      .meta span {
        padding: 6px 13px;
        border: 2px solid rgba(255, 246, 223, 0.4);
        border-radius: 999px;
        font-family: 'Lilita One', sans-serif;
        font-size: 15px;
        letter-spacing: 0.05em;
      }
      .stamp {
        position: absolute;
        right: 44px;
        bottom: 40px;
        padding: 10px 16px;
        background: #d92d25;
        border: 3px solid #fff6df;
        border-radius: 8px;
        box-shadow: 6px 6px 0 rgba(28, 15, 6, 0.8);
        font-family: 'Lilita One', sans-serif;
        font-size: 18px;
        line-height: 0.95;
        letter-spacing: 0.06em;
        text-align: center;
        transform: rotate(-7deg);
      }
    </style>
  </head>
  <body>
    <div class="art"></div>
    <svg class="papel" viewBox="0 0 1200 26" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 0h1200v6H0z" fill="#4e3020" />
      <g fill="#ffc72c">
        <path d="M0 6l30 16L60 6z" /><path d="M120 6l30 16 30-16z" /><path d="M240 6l30 16 30-16z" />
        <path d="M360 6l30 16 30-16z" /><path d="M480 6l30 16 30-16z" /><path d="M600 6l30 16 30-16z" />
        <path d="M720 6l30 16 30-16z" /><path d="M840 6l30 16 30-16z" /><path d="M960 6l30 16 30-16z" /><path d="M1080 6l30 16 30-16z" />
      </g>
      <g fill="#d63a74">
        <path d="M60 6l30 16 30-16z" /><path d="M300 6l30 16 30-16z" /><path d="M540 6l30 16 30-16z" />
        <path d="M780 6l30 16 30-16z" /><path d="M1020 6l30 16 30-16z" />
      </g>
      <g fill="#168f83">
        <path d="M180 6l30 16 30-16z" /><path d="M420 6l30 16 30-16z" /><path d="M660 6l30 16 30-16z" />
        <path d="M900 6l30 16 30-16z" /><path d="M1140 6l30 16 30-16z" />
      </g>
    </svg>
    <div class="frame"></div>
    <div class="copy">
      <p class="eyebrow">★ El corral de la fiesta ★</p>
      <h1><span class="gold">CHIHUAHUA</span><span class="green">BURRITAS</span></h1>
      <p class="lede">Gallinas con actitud. Chihuahuas con guantes. El último jinete en pie se lleva la fiesta.</p>
      <div class="meta"><span>Mejor de 3</span><span>32 personajes</span><span>Pixel art</span></div>
    </div>
    <div class="stamp">FIESTA<br />EDITION</div>
  </body>
</html>
